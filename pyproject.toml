[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "molmotion-research"
version = "0.1.0.dev0"
description = "Research code and evidence for slow-fast tetrapeptide trajectory generation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
model = ["torch>=2.1"]

[tool.setuptools.packages.find]
where = ["src"]
